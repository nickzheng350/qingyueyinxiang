# =============================================================================
# 清悦印象 AI - Production Docker Compose
# =============================================================================

services:

  # --------------------------------------------------------------------------
  # Frontend: Nginx serving static UI
  # --------------------------------------------------------------------------
  frontend:
    image: nginx:1.25-alpine
    container_name: hydraflow-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - ./ui/public:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    networks:
      - hydraflow-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3

  # --------------------------------------------------------------------------
  # Backend API
  # --------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: qingyueyinxiang:latest
    container_name: hydraflow-api
    restart: unless-stopped
    expose:
      - "8000"
    ports:
      - "8000:8000"
    environment:
      - ENV=production
      - LOG_LEVEL=${LOG_LEVEL:-info}
      # Database - optional, falls back to SQLite
      - DATABASE_URL=${DATABASE_URL:-}
      # Redis - optional, falls back to in-process cache
      - REDIS_URL=${REDIS_URL:-}
      # Security
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - API_KEY=${API_KEY:-}
    env_file:
      - .env
    volumes:
      - app-data:/app/data
      - app-logs:/app/logs
      - ./config:/app/config:ro
      - ./prompts:/app/prompts:ro
      - ./plugins:/app/plugins:ro
      - ./skills:/app/skills:ro
    networks:
      - hydraflow-net
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # --------------------------------------------------------------------------
  # Redis (optional cache layer)
  # --------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: hydraflow-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - hydraflow-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # --------------------------------------------------------------------------
  # PostgreSQL (optional database)
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: hydraflow-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hydraflow}
      POSTGRES_USER: ${POSTGRES_USER:-hydraflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hydraflow}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts:/docker-entrypoint-initdb.d:ro
    networks:
      - hydraflow-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hydraflow}"]
      interval: 10s
      timeout: 5s
      retries: 3

  # --------------------------------------------------------------------------
  # Prometheus metrics collector (optional)
  # --------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: hydraflow-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - hydraflow-net

  # --------------------------------------------------------------------------
  # Grafana dashboards (optional)
  # --------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: hydraflow-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - hydraflow-net

# =============================================================================
# Persistent volumes
# =============================================================================
volumes:
  app-data:
    driver: local
  app-logs:
    driver: local
  redis-data:
    driver: local
  postgres-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

# =============================================================================
# Network definitions
# =============================================================================
networks:
  hydraflow-net:
    driver: bridge