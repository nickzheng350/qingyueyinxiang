<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HydraFlow AI - 九头蛇生成式工作流平台</title>
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-card: #1a1a2e;
            --border: #2a2a3e;
            --text-primary: #e0e0e0;
            --text-secondary: #888;
            --accent: #6c5ce7;
            --accent-hover: #7d6ff0;
            --neon-cyan: #00f5ff;
            --neon-magenta: #ff00ff;
            --success: #00d68f;
            --error: #ff3d71;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
        }

        .header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header h1 {
            font-size: 20px;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-magenta));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header .status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .header .status .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px;
        }

        .main-panel {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
        }

        .main-panel h2 {
            font-size: 16px;
            margin-bottom: 16px;
            color: var(--text-primary);
        }

        .input-group {
            margin-bottom: 16px;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .input-group textarea {
            width: 100%;
            min-height: 100px;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            color: var(--text-primary);
            font-size: 14px;
            resize: vertical;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-group textarea:focus {
            border-color: var(--accent);
        }

        .select-row {
            display: flex;
            gap: 16px;
            margin-bottom: 16px;
        }

        .select-row .input-group {
            flex: 1;
        }

        .input-group select {
            width: 100%;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 12px;
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
            cursor: pointer;
        }

        .input-group select:focus {
            border-color: var(--accent);
        }

        .btn-generate {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--accent), var(--neon-magenta));
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-generate:hover { opacity: 0.9; }
        .btn-generate:disabled { opacity: 0.5; cursor: not-allowed; }

        .result-panel {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            display: none;
        }

        .result-panel.visible { display: block; }

        .result-panel h2 {
            font-size: 16px;
            margin-bottom: 16px;
        }

        .result-item {
            margin-bottom: 12px;
        }

        .result-item .label {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .result-item .value {
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 10px;
            font-size: 13px;
            word-break: break-all;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-top: 24px;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }

        .stat-card .stat-value {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--neon-cyan), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .stat-card .stat-label {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .loading.visible { display: block; }

        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .nav-tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 24px;
            background: var(--bg-secondary);
            border-radius: 8px;
            padding: 4px;
        }

        .nav-tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-size: 14px;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .nav-tab.active {
            background: var(--accent);
            color: white;
        }

        .nav-tab:hover:not(.active) {
            color: var(--text-primary);
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🐍 HydraFlow AI</h1>
        <div class="status">
            <div class="dot" id="statusDot"></div>
            <span id="statusText">连接中...</span>
        </div>
    </div>

    <div class="container">
        <div class="nav-tabs">
            <button class="nav-tab active" onclick="switchTab('generate')">🎨 生成</button>
            <button class="nav-tab" onclick="switchTab('models')">🤖 模型</button>
            <button class="nav-tab" onclick="switchTab('skills')">📦 技能</button>
            <button class="nav-tab" onclick="switchTab('system')">⚙️ 系统</button>
        </div>

        <div id="tab-generate" class="tab-content active">
            <div class="main-panel">
                <h2>✨ AI 生成</h2>
                <div class="input-group">
                    <label>输入提示词</label>
                    <textarea id="promptInput" placeholder="例如：生成一张赛博朋克风格的猫咪图片"></textarea>
                </div>
                <div class="select-row">
                    <div class="input-group">
                        <label>解析器</label>
                        <select id="parserSelect">
                            <option value="qwen2.5">Qwen2.5 (本地)</option>
                            <option value="llama">Llama (本地)</option>
                            <option value="openai">OpenAI (API)</option>
                            <option value="claude">Claude (API)</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>风格</label>
                        <select id="styleSelect">
                            <option value="">自动检测</option>
                            <option value="cyberpunk">赛博朋克</option>
                            <option value="anime">动漫</option>
                            <option value="fantasy">奇幻</option>
                            <option value="photorealistic">照片级真实感</option>
                            <option value="cinematic">电影制作</option>
                            <option value="scifi">科幻</option>
                            <option value="steampunk">蒸汽朋克</option>
                        </select>
                    </div>
                </div>
                <button class="btn-generate" id="generateBtn" onclick="generate()">🚀 生成</button>
            </div>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <div>正在生成中...</div>
            </div>

            <div class="result-panel" id="resultPanel">
                <h2>📊 生成结果</h2>
                <div class="result-item">
                    <div class="label">意图</div>
                    <div class="value" id="resultIntent"></div>
                </div>
                <div class="result-item">
                    <div class="label">风格</div>
                    <div class="value" id="resultStyle"></div>
                </div>
                <div class="result-item">
                    <div class="label">优化后提示词</div>
                    <div class="value" id="resultPrompt"></div>
                </div>
                <div class="result-item">
                    <div class="label">负面提示词</div>
                    <div class="value" id="resultNegative"></div>
                </div>
                <div class="result-item">
                    <div class="label">推荐模型</div>
                    <div class="value" id="resultModel"></div>
                </div>
            </div>
        </div>

        <div id="tab-models" class="tab-content">
            <div class="main-panel">
                <h2>🤖 模型管理</h2>
                <div id="modelsList">加载中...</div>
            </div>
        </div>

        <div id="tab-skills" class="tab-content">
            <div class="main-panel">
                <h2>📦 技能管理</h2>
                <div id="skillsList">加载中...</div>
            </div>
        </div>

        <div id="tab-system" class="tab-content">
            <div class="main-panel">
                <h2>⚙️ 系统信息</h2>
                <div class="stats-grid" id="systemStats">加载中...</div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin + '/api/v1';

        function switchTab(name) {
            document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('tab-' + name).classList.add('active');

            if (name === 'models') loadModels();
            if (name === 'skills') loadSkills();
            if (name === 'system') loadSystem();
        }

        async function checkHealth() {
            try {
                const res = await fetch('/health');
                const data = await res.json();
                document.getElementById('statusDot').style.background = '#00d68f';
                document.getElementById('statusText').textContent = '已连接 v' + data.version;
            } catch {
                document.getElementById('statusDot').style.background = '#ff3d71';
                document.getElementById('statusText').textContent = '未连接';
            }
        }

        async function generate() {
            const prompt = document.getElementById('promptInput').value.trim();
            if (!prompt) return;

            const btn = document.getElementById('generateBtn');
            const loading = document.getElementById('loading');
            const result = document.getElementById('resultPanel');

            btn.disabled = true;
            loading.classList.add('visible');
            result.classList.remove('visible');

            try {
                const res = await fetch(API_BASE + '/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        prompt,
                        parser: document.getElementById('parserSelect').value,
                        style: document.getElementById('styleSelect').value,
                    }),
                });
                const data = await res.json();

                document.getElementById('resultIntent').textContent = data.intent || '-';
                document.getElementById('resultStyle').textContent = data.style || '-';
                document.getElementById('resultPrompt').textContent = data.prompt || '-';
                document.getElementById('resultNegative').textContent = data.negative_prompt || '-';
                document.getElementById('resultModel').textContent = data.model ? data.model.id + ' (' + (data.model.name || '') + ')' : '-';
                result.classList.add('visible');
            } catch (e) {
                alert('生成失败: ' + e.message);
            } finally {
                btn.disabled = false;
                loading.classList.remove('visible');
            }
        }

        async function loadModels() {
            try {
                const res = await fetch(API_BASE + '/models');
                const data = await res.json();
                const el = document.getElementById('modelsList');
                if (data.models.length === 0) {
                    el.innerHTML = '<p style="color:var(--text-secondary)">暂无模型</p>';
                    return;
                }
                el.innerHTML = data.models.map(m =>
                    '<div style="padding:12px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px">' +
                    '<strong>' + (m.name || m.id) + '</strong>' +
                    '<span style="color:var(--text-secondary);margin-left:8px">' + m.category + ' / ' + (m.source || '') + '</span>' +
                    '</div>'
                ).join('');
            } catch {
                document.getElementById('modelsList').innerHTML = '<p style="color:var(--error)">加载失败</p>';
            }
        }

        async function loadSkills() {
            try {
                const res = await fetch(API_BASE + '/skills');
                const data = await res.json();
                const el = document.getElementById('skillsList');
                if (data.skills.length === 0) {
                    el.innerHTML = '<p style="color:var(--text-secondary)">暂无已安装技能。使用 <code>python scripts/skill_installer.py install-path /path/to/skill</code> 安装技能。</p>';
                    return;
                }
                el.innerHTML = data.skills.map(s =>
                    '<div style="padding:12px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px">' +
                    '<strong>' + (s.name || s.skill_id) + '</strong> v' + (s.version || '1.0.0') +
                    '<span style="color:var(--text-secondary);margin-left:8px">' + (s.type || '') + '</span>' +
                    '</div>'
                ).join('');
            } catch {
                document.getElementById('skillsList').innerHTML = '<p style="color:var(--error)">加载失败</p>';
            }
        }

        async function loadSystem() {
            try {
                const res = await fetch(API_BASE + '/system/info');
                const data = await res.json();
                document.getElementById('systemStats').innerHTML =
                    '<div class="stat-card"><div class="stat-value">' + (data.health_score || 0).toFixed(0) + '</div><div class="stat-label">健康分数</div></div>' +
                    '<div class="stat-card"><div class="stat-value">' + (data.models?.total_models || 0) + '</div><div class="stat-label">注册模型</div></div>' +
                    '<div class="stat-card"><div class="stat-value">' + (data.skills?.total_skills || 0) + '</div><div class="stat-label">已安装技能</div></div>' +
                    '<div class="stat-card"><div class="stat-value">' + (data.version || '-') + '</div><div class="stat-label">版本</div></div>';
            } catch {
                document.getElementById('systemStats').innerHTML = '<p style="color:var(--error)">加载失败</p>';
            }
        }

        checkHealth();
    </script>
</body>
</html>
