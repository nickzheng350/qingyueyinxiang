[mypy]
python_version = 3.10
# Keep comments ASCII-only: config files are read with the locale encoding.
# Start permissive: missing third-party stubs must not fail the run.
ignore_missing_imports = True
warn_unused_configs = True
warn_redundant_casts = True
no_implicit_optional = True
# Only check annotated functions for now, to avoid drowning in warnings.
check_untyped_defs = False
# Singleton base classes set _initialized via __new__; mypy cannot infer
# its type. These has-type notes are noise, not real bugs.
disable_error_code = has-type
exclude = (migrations|tests|\.venv|venv|ui|scripts)/

# Generated / third-party code is not type-checked
[mypy-alembic.*]
ignore_errors = True

[mypy-migrations.*]
ignore_errors = True
