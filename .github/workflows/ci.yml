name: HydraFlow AI CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test-python:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint
        run: |
          pip install ruff
          ruff check src/ main.py
      - name: Import check
        run: |
          python -c "from src.core import get_config; print('Core OK')"
          python -c "from src.intent_parser import IntentParserFactory; print('IntentParser OK')"
          python -c "from src.prompt_engine import PromptEngine; print('PromptEngine OK')"
          python -c "from src.model_dispatcher import ModelDispatcher; print('ModelDispatcher OK')"
          python -c "from src.skills import SkillManager; print('SkillManager OK')"
          python -c "from src.api import create_app; print('API OK')"

  test-node:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: npm install
      - name: Check CLI
        run: node bin/hydraflow.js --help
